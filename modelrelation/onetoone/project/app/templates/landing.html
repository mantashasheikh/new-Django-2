{% load static %}
<link rel="stylesheet" href="{% static 'css/landing.css' %}">
<body>

    <h1>Landing Page</h1>
    <p class="page-subtitle">
       Manage roll numbers and student information
    </p>


    <div class="main-container">

        <div class="section">

            <a href="{% url 'roll_number_view' %}">
                <button type="button" class="button">
                    Add Roll Number
                </button>
            </a>


            {% if show_roll_form %}

            <div class="form-box">

                <h3>Add New Roll</h3>

                <form method="POST">

                    {% csrf_token %}

                    <label for="roll_no">
                        Roll Number
                    </label>

                    <input
                        type="number"
                        id="roll_no"
                        name="roll_no"
                        placeholder="Enter Roll Number"
                        required
                    >

                    <button
                        type="submit"
                        class="add-button"
                    >
                        Add
                    </button>

                </form>

            </div>

            {% endif %}

        </div>



        <div class="section">

            <a href="{% url 'student_view' %}">
                <button type="button" class="button">
                    Add Student
                </button>
            </a>


            {% if show_student_form %}


            <div class="form-box">

                <h3>Add Student</h3>

                <form method="POST">

                    {% csrf_token %}

                    <label for="roll">
                        Roll Number
                    </label>

                    <select
                        id="roll"
                        name="roll"
                        required
                    >

                        <option value="">
                            Select Roll
                        </option>

                        {% for roll in roll_numbers %}

                        <option value="{{ roll.roll_no }}">
                            {{ roll.roll_no }}
                        </option>

                        {% endfor %}

                    </select>

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter Student Name"
                        required
                    >

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter Email"
                        required
                    >

                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="Enter City"
                        required
                    >

                    <label for="address">
                        Address
                    </label>

                    <input
                        type="text"
                        id="address"
                        name="address"
                        placeholder="Enter Address"
                        required
                    >

                    <label for="contact">
                        Contact
                    </label>

                    <input
                        type="text"
                        id="contact"
                        name="contact"
                        placeholder="Enter Contact Number"
                        required
                    >


                    <button
                        type="submit"
                        class="add-button"
                    >
                        Add
                    </button>

                </form>

            </div>

            {% endif %}

        </div>

    </div>

</body>
