{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link rel="stylesheet"
          href="{% static 'css/forgot_password.css' %}">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="icon-circle">
            🔐
        </div>

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            Enter your registered email address and we'll send you an OTP.
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'send_otp' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your registered email"
                    required
                >
            </div>

            <button type="submit" class="primary-btn">
                Send OTP
            </button>
        </form>

        <a href="{% url 'login' %}" class="back-login">
            ← Back to Login
        </a>

    </div>

</div>

</body>
</html>
