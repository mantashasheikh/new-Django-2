{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP</title>

    <link rel="stylesheet"
          href="{% static 'css/forgot_password.css' %}">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="icon-circle">
            ✉
        </div>

        <h1>Verify OTP</h1>

        <p class="subtitle">
            Enter the OTP sent to your registered email address.
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'submit_otp' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="sub_otp">Enter OTP</label>

                <input
                    type="text"
                    id="sub_otp"
                    name="sub_otp"
                    placeholder="Enter 5-digit OTP"
                    maxlength="5"
                    required
                >
            </div>

            <button type="submit" class="primary-btn">
                Verify OTP
            </button>
        </form>

        <a href="{% url 'forget_password' %}" class="back-login">
            ← Change Email
        </a>

    </div>

</div>

</body>
</html>
